name: CI

on:
  pull_request:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write # push report to gh-pages
  pull-requests: write

jobs:
  test:
    name: Playwright tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w apps/web
      - name: Run Playwright
        run: npx playwright test
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

  publish-report:
    name: Publish report to GitHub Pages
    needs: test
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: report
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: report
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true
      - uses: actions/github-script@v7
        with:
          script: |
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const url = `https://${owner}.github.io/${repo}/pr-${context.issue.number}/`;
            const marker = '<!-- playwright-report -->';
            const body = `${marker}\nPlaywright report: ${url}`;
            const { data } = await github.rest.issues.listComments({ owner, repo, issue_number: context.issue.number });
            const existing = data.find(c => c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: context.issue.number, body });
